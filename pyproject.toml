[project]
name = "datumoj"
version = "0.1.0"
description = "日本政府（其次欧美）公开数据的本地资料库与 AI 分析入口"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.3",
    "duckdb>=1.1",
    "pyarrow>=17",
    "lancedb>=0.13",
    "mcp>=1.2",
    "boto3>=1.34",
]

[project.scripts]
rikolto = "datumoj.rikolto.cli:app"
eltiro = "datumoj.eltiro.cli:app"
# Temporary shortcut: 本机重装 launchd 并核对 JMA 无缺口后删除 datumoj 别名。
datumoj = "datumoj.rikolto.cli:app"

[dependency-groups]
dev = [
    "moto[s3,server]>=5.0",
    "pytest>=8.2",
    "pytest-httpserver>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datumoj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Tests compact with retain=0 on private tables; production defaults to DATUMOJ_VECTOR_RETAIN_HOURS=1.
filterwarnings = ["ignore:optimize\\(cleanup_older_than=0\\):UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
