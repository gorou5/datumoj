id: datumoj.rawstore.s3
name: S3-compatible raw blob storage
version: "1"
description: Immutable sha256-addressed raw storage for an existing S3-compatible bucket.
inputs:
  configuration: datumoj.core.storage.StorageConfig
  put: bytes or binary stream
  lookup: 64 lowercase hexadecimal sha256 characters
outputs:
  put: sha256
  get: bytes after integrity verification
  open: caller-owned readonly seekable binary stream after integrity verification
  exists: boolean from HEAD
  verify: null on success
runtime: Python >=3.12,<3.14; locked boto3; filesystem temporary space; S3-compatible HTTP(S) endpoint
permissions:
  bucket: Existing bucket only; no provisioning
  objects: s3:GetObject and s3:PutObject under configured prefix (HEAD requires read permission)
  multipart: s3:AbortMultipartUpload for failed large uploads
  credentials: R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY from process environment at client construction only
authentication: AWS Signature Version 4; explicit path-style endpoint; no default credential-provider fallback
timeouts: connect 10 seconds; read 60 seconds; SDK max_attempts 2 retries
source:
  data: Caller-supplied raw bytes; no external dataset bundled
  license: unknown
errors:
  ValueError: Invalid sha256, invalid configuration, or missing named credentials
  NotFoundError: Object missing
  CorruptedBlob: Downloaded content does not match sha256
  ContractError: SDK failure; static message without SDK payload or exception chain
testing: make check T=tests/core/test_rawstore_s3.py; RawStoreSuite with ThreadedMotoServer on loopback
maintenance: proposed implementation; human review required by DATUMOJ-TACHIBANA-103
