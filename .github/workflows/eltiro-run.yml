name: Eltiro Run

'on':
  workflow_dispatch:
    inputs:
      demands:
        description: Demand ids from eval/eltiro/demands, comma separated (lowercase letters, digits, hyphen)
        type: string
        required: true
        default: three-gdp-reconciliation
      bindings:
        description: Confirmation list file name under eval/eltiro/bindings (empty for the first run)
        type: string
        required: false
        default: ''

concurrency:
  group: rikolto-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.repository == 'gorou5/datumoj'
    runs-on: ubuntu-24.04
    timeout-minutes: 330  # restore alone has taken 53-164 min (hosted runner cap is 360)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.7.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Run Eltiro demands on the latest verified generation
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DATUMOJ_S3_BUCKET: ${{ secrets.DATUMOJ_S3_BUCKET }}
          DATUMOJ_S3_PREFIX: ${{ secrets.DATUMOJ_S3_PREFIX }}
          DATUMOJ_RAW_BACKEND: s3
          DATUMOJ_VECTORS: 'off'
          DEMANDS: ${{ inputs.demands }}
          BINDINGS: ${{ inputs.bindings }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEMANDS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]]; then
            exit 1
          fi
          binding_args=()
          if [[ -n "${BINDINGS:-}" ]]; then
            if [[ ! "$BINDINGS" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*\.yaml$ || "$BINDINGS" == *..* ]]; then
              exit 1
            fi
            binding_args=(--bindings="eval/eltiro/bindings/$BINDINGS")
          fi
          uv run --frozen python scripts/eltiro_cloud.py "$RUNNER_TEMP/eltiro-data" "$RUNNER_TEMP/eltiro-output" --demands="$DEMANDS" ${binding_args[@]+"${binding_args[@]}"}
      - name: Upload value-free summary (and the package only when the license gate passed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eltiro-run
          path: ${{ runner.temp }}/eltiro-output
          if-no-files-found: error
          retention-days: 7
