name: Cloud run

'on':
  workflow_dispatch:

concurrency:
  group: datumoj-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # A fork may retain this file, but must not run a writer for this namespace.
    if: github.repository == 'gorou5/datumoj'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.7.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Cache embedding model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.ollama/models
          key: ollama-0.6.8-bge-m3-v1
      - name: Install verified Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/ollama-linux-amd64.tgz" \
            https://github.com/ollama/ollama/releases/download/v0.6.8/ollama-linux-amd64.tgz
          echo '9f9ff52b8297d6e40904f22bac09eac587a05111762bf278359621fbdb53dbb9  '"$RUNNER_TEMP/ollama-linux-amd64.tgz" | sha256sum --check --status
          sudo tar -xzf "$RUNNER_TEMP/ollama-linux-amd64.tgz" -C /usr
      - name: Prepare embedding service
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > /dev/null 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull bge-m3 > /dev/null 2>&1
      - name: Run due sources and publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DATUMOJ_S3_BUCKET: ${{ secrets.DATUMOJ_S3_BUCKET }}
          DATUMOJ_S3_PREFIX: ${{ secrets.DATUMOJ_S3_PREFIX }}
          DATUMOJ_RAW_BACKEND: s3
        run: uv run --frozen datumoj cloud run --max-embed 1000 --max-minutes 40
