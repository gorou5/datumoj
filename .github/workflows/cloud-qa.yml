name: Cloud QA

'on':
  workflow_dispatch:
    inputs:
      questions:
        description: Repository question list path (public source data only)
        type: string
        required: true
        default: eval/acceptance/v0.3.0-maple-h5.yaml

concurrency:
  group: rikolto-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.repository == 'gorou5/datumoj'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.7.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Cache embedding model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.ollama/models
          key: ollama-0.6.8-bge-m3-v1
      - name: Install verified Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/ollama-linux-amd64.tgz" \
            https://github.com/ollama/ollama/releases/download/v0.6.8/ollama-linux-amd64.tgz
          echo '9f9ff52b8297d6e40904f22bac09eac587a05111762bf278359621fbdb53dbb9  '"$RUNNER_TEMP/ollama-linux-amd64.tgz" | sha256sum --check --status
          sudo tar -xzf "$RUNNER_TEMP/ollama-linux-amd64.tgz" -C /usr
      - name: Prepare embedding service
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > /dev/null 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull bge-m3 > /dev/null 2>&1
      - name: Answer questions from latest verified generation
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DATUMOJ_S3_BUCKET: ${{ secrets.DATUMOJ_S3_BUCKET }}
          DATUMOJ_S3_PREFIX: ${{ secrets.DATUMOJ_S3_PREFIX }}
          DATUMOJ_RAW_BACKEND: s3
          DATUMOJ_VECTORS: 'on'
          QUESTION_LIST: ${{ inputs.questions }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python scripts/cloud_qa.py "$RUNNER_TEMP/cloud-qa-data" "$QUESTION_LIST" "$RUNNER_TEMP/cloud-qa-answers"
      - name: Upload public QA answers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-qa-answers
          path: |
            ${{ runner.temp }}/cloud-qa-answers/answers.json
            ${{ runner.temp }}/cloud-qa-answers/answers.md
          if-no-files-found: error
          retention-days: 7
