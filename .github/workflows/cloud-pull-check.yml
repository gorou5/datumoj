name: Cloud pull check

'on':
  workflow_dispatch:

concurrency:
  group: rikolto-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.repository == 'gorou5/datumoj'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.7.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Check latest published generation
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DATUMOJ_S3_BUCKET: ${{ secrets.DATUMOJ_S3_BUCKET }}
          DATUMOJ_S3_PREFIX: ${{ secrets.DATUMOJ_S3_PREFIX }}
          DATUMOJ_RAW_BACKEND: s3
          DATUMOJ_VECTORS: 'off'
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python scripts/pull_check.py "$RUNNER_TEMP/pull-check"
