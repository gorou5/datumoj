<rect x="498" y="622" width="130" height="40" rx="8" fill="#ffffff" stroke="#d8d5cc" stroke-width="1.4"/>
<text x="563.0" y="647" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1f23" >Snapshot 快照</text>
<line x1="630" y1="642" x2="650" y2="642" stroke="#5c6470" stroke-width="1.8" marker-end="url(#arr)"/>
