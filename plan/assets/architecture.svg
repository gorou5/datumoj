<text x="881.0" y="647" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1f23" >Chunk 文本块</text>
<rect x="36" y="680" width="270" height="40" rx="8" fill="#ffffff" stroke="#d8d5cc" stroke-width="1.4"/>
<text x="171" y="705" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1f23" >Snapshot ──► Table 表格 ──► Observation 观测值</text>
<text x="330" y="705" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6470" >Observation 必带：单位 · 口径 · 调查名 · 出处 —— 不同调查的数据不直接相加</text>
<text x="36" y="756" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6470" >七条开发线各管一段：契约（模型/协议/文本工具）· A 抓取基础 · B 文档线 · C 统计线 · D 目录线 · E 检索线 · F 入口线 · G 评测线 —— 只依赖契约，不互相 import 实现</text>
</svg>