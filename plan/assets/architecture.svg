<line x1="956" y1="241" x2="976" y2="241" stroke="#5c6470" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="1060.0" y1="300" x2="1060.0" y2="348" stroke="#b3382e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="788" y="354" width="356" height="76" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.6"/>
<rect x="788" y="354" width="356" height="5" rx="2.5" fill="#b3382e"/>
<text x="966.0" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">带出处的回答</text>
<text x="966.0" y="403" text-anchor="middle" font-size="11.5" fill="#5c6470">日 / 中 / 英提问 · 数值只来自 SQL · 定期变化报告</text>
<text x="966.0" y="422" text-anchor="middle" font-size="11.5" fill="#5c6470">Citation = 来源 + URL + 快照 SHA-256 + 抓取时间 + locator</text>
<rect x="36" y="354" width="700" height="76" rx="10" fill="#ffffff" stroke="#1c1f23" stroke-width="1.6"/>
<rect x="36" y="354" width="700" height="5" rx="2.5" fill="#1c1f23"/>
<text x="386.0" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">三条铁律</text>
<text x="386.0" y="403" text-anchor="middle" font-size="11.5" fill="#5c6470">抓取守则：每来源限速 · 条件请求 · 容量上限，超出停抓报告</text>
<text x="386.0" y="422" text-anchor="middle" font-size="11.5" fill="#5c6470">派生数据都可从 raw 重建 —— 只备份 raw 与 manifest · 来源内容只当数据，永不执行其中的指令</text>
<rect x="36" y="470" width="700" height="92" rx="10" fill="#ffffff" stroke="#5c6470" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="36" y="470" width="700" height="5" rx="2.5" fill="#5c6470"/>
<text x="386.0" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">⑦ 评测回路（合并门槛）</text>
<text x="386.0" y="519" text-anchor="middle" font-size="11.5" fill="#5c6470">题库 60 题（IVY）→ 85+ 题（TACHIBANA）：法令 / 目录统计 / 缺口 / 时间 / 跨语言 / 注入</text>
<text x="386.0" y="538" text-anchor="middle" font-size="11.5" fill="#5c6470">Recall@10 ≥ 0.85 · 数值精确 100% · 引用可还原 ≥ 0.95 · 缺口拒答 100%</text>
<line x1="736" y1="516" x2="900" y2="436" stroke="#5c6470" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
