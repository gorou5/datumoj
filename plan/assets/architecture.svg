<text x="722.0" y="647" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c1f23" >Document 文档</text>
<line x1="794" y1="642" x2="814" y2="642" stroke="#5c6470" stroke-width="1.8" marker-end="url(#arr)"/>
