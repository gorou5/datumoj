<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect width="1180" height="800" fill="#faf9f6"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c6470"/></marker></defs>
<text x="36" y="46" text-anchor="start" font-size="26" font-weight="700" fill="#1c1f23" >DATUMOJ 总体架构</text>
<text x="36" y="72" text-anchor="start" font-size="13.5" font-weight="400" fill="#5c6470" >先抓下来、存成带出处的本地资料库，再让 AI 在库上检索问答 —— 抓取与问答分离，结果可复现</text>
<rect x="390" y="92" width="400" height="62" rx="10" fill="#ffffff" stroke="#2f6db3" stroke-width="1.6"/>
<rect x="390" y="92" width="400" height="5" rx="2.5" fill="#2f6db3"/>
<text x="590.0" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">来源注册表 sources/*.yaml</text>
<text x="590.0" y="141" text-anchor="middle" font-size="11.5" fill="#5c6470">范围白名单 · 许可 · 抓取频率 · 策略</text>
<line x1="590" y1="154" x2="590" y2="176" stroke="#2f6db3" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="36" y="182" width="168" height="118" rx="10" fill="#ffffff" stroke="#3d7a44" stroke-width="1.6"/>
<rect x="36" y="182" width="168" height="5" rx="2.5" fill="#3d7a44"/>
<text x="120.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">① 抓取 crawl</text>
<text x="120.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">礼貌 HTTP：限速 1/s</text>
<text x="120.0" y="250" text-anchor="middle" font-size="11.5" fill="#5c6470">条件请求 · 退避重试</text>
<text x="120.0" y="269" text-anchor="middle" font-size="11.5" fill="#5c6470">robots · 许可核对</text>
<rect x="224" y="182" width="168" height="118" rx="10" fill="#ffffff" stroke="#3d7a44" stroke-width="1.6"/>
<rect x="224" y="182" width="168" height="5" rx="2.5" fill="#3d7a44"/>
<text x="308.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">② 原始库 raw</text>
<text x="308.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">按内容哈希寻址</text>
<text x="308.0" y="250" text-anchor="middle" font-size="11.5" fill="#5c6470">不可变 · manifest</text>
<text x="308.0" y="269" text-anchor="middle" font-size="11.5" fill="#5c6470">记录每次抓取</text>
<rect x="412" y="182" width="168" height="118" rx="10" fill="#ffffff" stroke="#cf7226" stroke-width="1.6"/>
<rect x="412" y="182" width="168" height="5" rx="2.5" fill="#cf7226"/>
<text x="496.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">③ 解析 parse</text>
<text x="496.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">按格式分流</text>
<text x="496.0" y="250" text-anchor="middle" font-size="11.5" fill="#5c6470">插件自动发现</text>
<text x="496.0" y="269" text-anchor="middle" font-size="11.5" fill="#5c6470">增量处理</text>
<rect x="600" y="182" width="168" height="56" rx="10" fill="#ffffff" stroke="#2f6db3" stroke-width="1.6"/>
<rect x="600" y="182" width="168" height="5" rx="2.5" fill="#2f6db3"/>
<text x="684.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">④a 结构化轨道</text>
<text x="684.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">表格 → Parquet + DuckDB</text>
<rect x="600" y="246" width="168" height="56" rx="10" fill="#ffffff" stroke="#7a4fa3" stroke-width="1.6"/>
<rect x="600" y="246" width="168" height="5" rx="2.5" fill="#7a4fa3"/>
<text x="684.0" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">④b 文档轨道</text>
<text x="684.0" y="295" text-anchor="middle" font-size="11.5" fill="#5c6470">法令/公告 → chunks 带定位</text>
<rect x="788" y="182" width="168" height="118" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
<rect x="788" y="182" width="168" height="5" rx="2.5" fill="#0f766e"/>
<text x="872.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">⑤ 索引 index</text>
<text x="872.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">FTS5 trigram 关键词</text>
<text x="872.0" y="250" text-anchor="middle" font-size="11.5" fill="#5c6470">向量 LanceDB</text>
<text x="872.0" y="269" text-anchor="middle" font-size="11.5" fill="#5c6470">混合检索 RRF</text>
<rect x="976" y="182" width="168" height="118" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.6"/>
<rect x="976" y="182" width="168" height="5" rx="2.5" fill="#b3382e"/>
<text x="1060.0" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1f23">⑥ 分析层</text>
<text x="1060.0" y="231" text-anchor="middle" font-size="11.5" fill="#5c6470">工具：search / sql</text>
<text x="1060.0" y="250" text-anchor="middle" font-size="11.5" fill="#5c6470">catalog / cite / …</text>
<text x="1060.0" y="269" text-anchor="middle" font-size="11.5" fill="#5c6470">入口：MCP + CLI</text>
