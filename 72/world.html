<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>评论区粘土世界 · 全景 — 72 号人物资产库</title>
<meta name="description" content="72 号评论区人物资产库的世界全景：六大阵营化作六座漂浮在漆黑虚空里的粘土岛，69 个角色站在各自的岛上，点任意角色直达他的资产卡。">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#060607}
  body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans SC",system-ui,sans-serif;color:#f3ead8;
    -webkit-user-select:none;user-select:none}
  #scene{position:fixed;inset:0;display:block;touch-action:none}
  .hud{position:fixed;z-index:5}
  #backBtn{top:14px;left:14px;background:#fdf6e3;color:#26221c;border:3px solid #26221c;border-radius:99px;
    padding:8px 16px;font-weight:800;font-size:14px;text-decoration:none;box-shadow:4px 4px 0 #26221c}
  #backBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #26221c}
  #titleBox{top:12px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;width:max-content;max-width:92vw}
  #titleBox h1{font-size:clamp(19px,3.4vw,30px);letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 22px rgba(0,0,0,.9)}
  #titleBox p{font-size:12.5px;opacity:.85;margin-top:3px;text-shadow:0 1px 0 #000}
  #hint{bottom:14px;left:50%;transform:translateX(-50%);background:rgba(20,16,10,.72);border:2px solid rgba(243,234,216,.35);
    border-radius:99px;padding:7px 16px;font-size:12.5px;white-space:nowrap;pointer-events:none}
  @media(max-width:640px){
    #titleBox{top:62px}
    #titleBox h1{font-size:19px}
    #titleBox p{font-size:11px}
    #backBtn{font-size:13px;padding:7px 13px}
    #hint{font-size:11px;bottom:10px}
  }
  #tip{position:fixed;z-index:6;pointer-events:none;background:#fdf6e3;color:#26221c;border:2.5px solid #26221c;border-radius:12px;
    padding:6px 11px;font-size:13px;font-weight:700;box-shadow:3px 3px 0 rgba(0,0,0,.55);opacity:0;transition:opacity .12s;max-width:70vw}
  #tip small{display:block;font-weight:500;font-size:11.5px;opacity:.75}
  #loading{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
    background:#060607;transition:opacity .5s}
  #loading .big{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #loading p{font-size:14px;opacity:.85}
  #fallback{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#060607;padding:22px;text-align:center}
  #fallback img{max-width:min(680px,92vw);border:3px solid #f3ead8;border-radius:16px}
  #fallback a{color:#e9b44c;font-weight:800}
</style>
<script type="importmap">
{"imports":{
  "three":"/vendor/three.module.min.js",
  "three/addons/":"/vendor/"
}}
</script>
</head>
<body>
<canvas id="scene"></canvas>

<a class="hud" id="backBtn" href="/">← 回到选人画面</a>
<div class="hud" id="titleBox">
  <h1>🌍 评论区粘土世界 · 全景</h1>
  <p>六大阵营 · 六座粘土岛 · 69 个角色都在岛上</p>
</div>
<div class="hud" id="hint">🖱️ 拖动旋转 · 滚轮缩放 · 点任意角色看他的资产卡</div>
<div id="tip"></div>

<div id="loading"><div class="big">🪐</div><p>正在把世界捏出来…</p></div>
<div id="fallback">
  <p style="font-size:17px;font-weight:800">这台设备捏不动 3D 世界（WebGL 不可用）</p>
  <img src="/img/world-thumb.webp" alt="粘土世界全景缩略图">
  <p>先看张全景图过过瘾，角色档案在选人画面里一个不少。</p>
  <a href="/">← 回到选人画面</a>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/vendor/OrbitControls.js';

const STILL = new URLSearchParams(location.search).has('still');
if(new URLSearchParams(location.search).has('clean')){
  const st = document.createElement('style');
  st.textContent = '.hud,#hint{display:none!important}';
  document.head.appendChild(st);
}
const tip = document.getElementById('tip');
const loadingEl = document.getElementById('loading');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('scene'), antialias:true, powerPreference:'low-power'});
}catch(e){
  document.getElementById('fallback').style.display='flex';
  loadingEl.style.display='none';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060607);
scene.fog = new THREE.FogExp2(0x060607, 0.0026);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
const _fitK = innerWidth/innerHeight < 1 ? Math.min(1/(innerWidth/innerHeight), 1.9) : 1;
const CAM_END = new THREE.Vector3(0, 48*_fitK, 78*_fitK);
const CAM_START = new THREE.Vector3(0, 115, 195);
camera.position.copy(STILL ? CAM_END : CAM_START);

scene.add(new THREE.HemisphereLight(0xfff2dd, 0x241a33, 0.95));
const sun = new THREE.DirectionalLight(0xffe6b8, 1.7);
sun.position.set(34, 55, 22);
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 150;
controls.maxPolarAngle = 1.48;
controls.enabled = STILL;

/* ---------- 按需渲染：只在有变化时画一帧，不跑持续循环 ---------- */
let renderQueued = false;
function render(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued = false; renderer.render(scene, camera); });
}
controls.addEventListener('change', render);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  render();
});

/* ---------- 确定性伪随机（同 id 永远同布局） ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 指纹泥纹：小画布一次生成，全岛共用 ---------- */
function clayBumpTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  const rnd = mulberry32(72);
  for(let i=0;i<340;i++){
    g.beginPath();
    const x = rnd()*256, y = rnd()*256, r = 4+rnd()*16;
    g.arc(x, y, r, rnd()*6.28, rnd()*3+1.2);
    g.strokeStyle = `rgba(${rnd()>0.5?255:0},${rnd()>0.5?255:0},${rnd()>0.5?255:0},0.10)`;
    g.lineWidth = 1+rnd()*2.2; g.stroke();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3,2);
  return tx;
}
const bumpTex = clayBumpTexture();

function jitterGeo(geo, amt, seed){
  const rnd = mulberry32(seed);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setXYZ(i, p.getX(i)+(rnd()-0.5)*amt, p.getY(i)+(rnd()-0.5)*amt*0.5, p.getZ(i)+(rnd()-0.5)*amt);
  }
  geo.computeVertexNormals();
  return geo;
}

function textSprite(text, sub, scale=1, fg='#fdf6e3'){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 160;
  const g = cv.getContext('2d');
  g.textAlign = 'center';
  g.font = '900 62px "Hiragino Maru Gothic ProN","Noto Sans SC",sans-serif';
  g.lineWidth = 10; g.strokeStyle = 'rgba(10,8,4,0.9)';
  g.strokeText(text, 256, 68); g.fillStyle = fg; g.fillText(text, 256, 68);
  if(sub){
    g.font = '700 40px "Hiragino Maru Gothic ProN","Noto Sans SC",sans-serif';
    g.lineWidth = 8; g.strokeText(sub, 256, 128); g.fillStyle = '#e9b44c'; g.fillText(sub, 256, 128);
  }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  sp.scale.set(11*scale, 3.44*scale, 1);
  return sp;
}

/* ---------- 岛屿 ---------- */
function makeIsland(R, colorHex, seed){
  const grp = new THREE.Group();
  const color = new THREE.Color(colorHex);
  const side = new THREE.Mesh(
    jitterGeo(new THREE.CylinderGeometry(R*0.88, R*0.40, 2.6, 26, 3), R*0.06, seed),
    new THREE.MeshLambertMaterial({color, flatShading:true, bumpMap:bumpTex, bumpScale:0.6}));
  grp.add(side);
  const top = new THREE.Mesh(
    jitterGeo(new THREE.CircleGeometry(R*0.88, 26), R*0.04, seed+7),
    new THREE.MeshLambertMaterial({color: color.clone().lerp(new THREE.Color(0xffffff), 0.20), flatShading:true, bumpMap:bumpTex, bumpScale:0.5}));
  top.rotation.x = -Math.PI/2; top.position.y = 1.31;
  grp.add(top);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(R*0.88, 0.20, 8, 42),
    new THREE.MeshLambertMaterial({color: color.clone().lerp(new THREE.Color(0x000000), 0.18), flatShading:true}));
  rim.rotation.x = Math.PI/2; rim.position.y = 1.30;
  grp.add(rim);
  const tipRock = new THREE.Mesh(
    jitterGeo(new THREE.ConeGeometry(R*0.40, 3.6, 7), R*0.08, seed+13),
    new THREE.MeshLambertMaterial({color:0x6f5b74, flatShading:true}));
  tipRock.rotation.x = Math.PI; tipRock.position.y = -3.05;
  grp.add(tipRock);
  return grp;
}

/* ---------- 星空与漂浮石（静态，一次成型） ---------- */
{
  const n = 480, pos = new Float32Array(n*3), rnd = mulberry32(9);
  for(let i=0;i<n;i++){
    const th = rnd()*Math.PI*2, ph = Math.acos(rnd()*1.7-0.85), r = 190+rnd()*160;
    pos[i*3] = r*Math.sin(ph)*Math.cos(th); pos[i*3+1] = Math.abs(r*Math.cos(ph))*0.7-25; pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xaFC4e8, size:1.7, sizeAttenuation:false, transparent:true, opacity:0.85, fog:false})));
  const rockGeo = new THREE.IcosahedronGeometry(1, 0);
  const rockMat = new THREE.MeshLambertMaterial({color:0x77648a, flatShading:true});
  const rnd2 = mulberry32(31);
  for(let i=0;i<14;i++){
    const m = new THREE.Mesh(rockGeo, rockMat);
    const a = rnd2()*Math.PI*2, r = 52+rnd2()*46;
    m.position.set(Math.cos(a)*r, -8+rnd2()*26, Math.sin(a)*r);
    m.rotation.set(rnd2()*3, rnd2()*3, rnd2()*3);
    m.scale.setScalar(0.6+rnd2()*1.9);
    scene.add(m);
  }
}

/* ---------- 数据驱动建岛 ---------- */
const pickables = [];
let loaded = 0, totalToLoad = 69;

fetch('/characters.json').then(r=>r.json()).then(chars=>{
  totalToLoad = chars.length;
  const factions = [];
  for(const c of chars){ if(!factions.includes(c.faction)) factions.push(c.faction); }
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  factions.forEach((f, i)=>{
    const members = chars.filter(c=>c.faction===f);
    const R = 4.6 + members.length*0.52;
    const ang = (i/factions.length)*Math.PI*2 + 0.26;
    const ix = Math.cos(ang)*37, iz = Math.sin(ang)*37;
    const island = makeIsland(R, members[0].color, 100+i*17);
    island.position.set(ix, 0, iz);
    scene.add(island);
    const label = textSprite(f, members.length + ' 人', 1);
    label.position.set(ix, R*0.42 + 5.4, iz);
    scene.add(label);

    const rnd = mulberry32(500+i*131);
    members.forEach((c, k)=>{
      const rad = (R-1.8)*Math.sqrt((k+0.5)/members.length);
      const th = k*2.399963 + rnd()*0.5;
      const x = ix + Math.cos(th)*rad, z = iz + Math.sin(th)*rad;
      loader.load('/'+c.avatar.replace('avatar-','avatar-token-'), tx=>{
        tx.colorSpace = THREE.SRGBColorSpace;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tx, transparent:true}));
        const h = 2.35, w = h*(tx.image.width/tx.image.height);
        sp.scale.set(w, h, 1);
        sp.position.set(x, 1.31 + h/2, z);
        sp.userData = {id:c.id, name:c.name, title:c.title, baseScale:new THREE.Vector3(w,h,1)};
        scene.add(sp);
        pickables.push(sp);
        if(++loaded >= totalToLoad){ loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.remove(), 550); }
        render();
      }, undefined, ()=>{ if(++loaded >= totalToLoad){ loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.remove(), 550); } });
    });
  });

  /* 中央隐藏岛：No.70–72 */
  const hidden = makeIsland(5.2, '#4a4157', 999);
  hidden.position.set(0, -0.4, 0);
  scene.add(hidden);
  const hLabel = textSprite('？？？', '隐藏角色 · 尚未揭晓', 0.9, '#cfc4e8');
  hLabel.position.set(0, 7.4, 0);
  scene.add(hLabel);
  [[-1.9,-0.6],[0.2,1.2],[2.1,-0.9]].forEach((off, i)=>{
    const mon = new THREE.Mesh(
      jitterGeo(new THREE.BoxGeometry(1.15, 2.7, 0.55), 0.06, 700+i),
      new THREE.MeshLambertMaterial({color:0x8d84a0, flatShading:true, bumpMap:bumpTex, bumpScale:0.4}));
    mon.position.set(off[0], 1.31+1.35-0.4, off[1]);
    mon.rotation.y = i*0.5 - 0.4;
    mon.userData = {hidden:true};
    scene.add(mon);
    pickables.push(mon);
    const q = textSprite('？', '', 0.42, '#fdf6e3');
    q.position.set(off[0], 4.6, off[1]);
    q.userData = {hidden:true};
    scene.add(q);
    pickables.push(q);
  });
  render();
}).catch(()=>{
  document.getElementById('fallback').style.display='flex';
  loadingEl.style.display='none';
});

/* ---------- 点选与悬停 ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hovered = null;
function castAt(cx, cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}
function showTip(obj, cx, cy){
  if(obj.userData.hidden){
    tip.innerHTML = '🔒 隐藏角色<small>本人还没被想出来 · No.70–72</small>';
  }else{
    tip.innerHTML = `No.${obj.userData.id} ${obj.userData.name}<small>${obj.userData.title} · 点击查看资产卡</small>`;
  }
  tip.style.left = Math.min(cx+16, innerWidth-190)+'px';
  tip.style.top = Math.max(cy-14, 8)+'px';
  tip.style.opacity = '1';
}
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; cancelIntro(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 7) return;
  const obj = castAt(e.clientX, e.clientY);
  if(!obj) return;
  if(obj.userData.hidden){ showTip(obj, e.clientX, e.clientY); return; }
  location.href = '/#c' + obj.userData.id;
});
let moveQueued = false;
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerType !== 'mouse' || moveQueued) return;
  moveQueued = true;
  requestAnimationFrame(()=>{
    moveQueued = false;
    const obj = castAt(e.clientX, e.clientY);
    if(hovered && hovered !== obj && hovered.userData.baseScale){
      hovered.scale.copy(hovered.userData.baseScale); render();
    }
    hovered = obj;
    if(obj){
      renderer.domElement.style.cursor = 'pointer';
      if(obj.userData.baseScale){ obj.scale.copy(obj.userData.baseScale).multiplyScalar(1.13); render(); }
      showTip(obj, e.clientX, e.clientY);
    }else{
      renderer.domElement.style.cursor = '';
      tip.style.opacity = '0';
    }
  });
});

/* ---------- 开场巡航（Google 地球式由远及近，可打断） ---------- */
let intro = null;
function cancelIntro(){ if(intro){ intro.done = true; controls.enabled = true; } }
if(!STILL){
  intro = {t0: performance.now(), dur: 2300, done:false};
  (function step(){
    if(intro.done) { render(); return; }
    const t = Math.min((performance.now()-intro.t0)/intro.dur, 1);
    const e = 1 - Math.pow(1-t, 3);
    camera.position.lerpVectors(CAM_START, CAM_END, e);
    camera.lookAt(0, 1, 0);
    renderer.render(scene, camera);
    if(t < 1) requestAnimationFrame(step);
    else { intro.done = true; controls.enabled = true; render(); }
  })();
}else{
  render();
}
</script>
</body>
</html>
