/* ---------- 工具：确定性随机 / 泥纹 / 材质缓存 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clayBumpTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  const rnd = mulberry32(72);
  for(let i=0;i<340;i++){
    g.beginPath();
    const x = rnd()*256, y = rnd()*256, r = 4+rnd()*16;
    g.arc(x, y, r, rnd()*6.28, rnd()*3+1.2);
    const v = rnd()>0.5?255:0;
    g.strokeStyle = `rgba(${v},${v},${v},0.10)`;
    g.lineWidth = 1+rnd()*2.2; g.stroke();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3,2);
  return tx;
}
const bumpTex = clayBumpTexture();
function blotchTex(base, blotch, n, rMin, rMax, seed, extra){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  const rnd = mulberry32(seed);
  for(let i=0;i<n;i++){
    const x = rnd()*256, y = rnd()*256, r = rMin + rnd()*(rMax-rMin);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, blotch); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  if(extra) extra(g, rnd);
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}
const groundTex = blotchTex('#cbb28a', 'rgba(120,90,50,0.20)', 60, 18, 60, 501, (g, rnd)=>{
  for(let i=0;i<2600;i++){ g.fillStyle = `rgba(${60+rnd()*60|0},${45+rnd()*40|0},20,${0.05+rnd()*0.10})`; g.fillRect(rnd()*256, rnd()*256, 1.6, 1.6); }
});
groundTex.repeat.set(0.045,0.045);
const wallTex = blotchTex('#f2e8d8', 'rgba(150,110,70,0.16)', 46, 10, 42, 502, (g, rnd)=>{
  g.strokeStyle = 'rgba(120,85,50,0.13)';
  for(let i=0;i<26;i++){ g.beginPath(); const x=rnd()*256, y=rnd()*256; g.arc(x, y, 3+rnd()*9, rnd()*6.28, rnd()*3+1); g.lineWidth = 1+rnd()*1.6; g.stroke(); }
});
const roadTex = (()=>{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#5e4630'; g.fillRect(0,0,256,256);
  const rnd = mulberry32(503);
  for(let ry=0; ry<4; ry++) for(let rx=0; rx<4; rx++){
    const x = rx*64+32+(rnd()-0.5)*7, y = ry*64+32+(rnd()-0.5)*7, r = 24+rnd()*5;
    const gr = g.createRadialGradient(x-6, y-8, 2, x, y, r);
    gr.addColorStop(0, '#a8895e'); gr.addColorStop(0.8, '#8a6d4a'); gr.addColorStop(1, '#6e5138');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
})();
roadTex.repeat.set(9,9);
const shadowTex = (()=>{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64,64,4, 64,64,62);
  gr.addColorStop(0, 'rgba(12,6,2,0.55)'); gr.addColorStop(0.7, 'rgba(12,6,2,0.28)'); gr.addColorStop(1, 'rgba(12,6,2,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
})();
const SHADOW_MAT = new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false});
SHADOW_MAT.userData.mergeable = true;
function shadowDisc(x, y, z, r, parent=scene, opacity=1){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r*2, r*2), SHADOW_MAT);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, y, z);
  m.renderOrder = 1;
  parent.add(m);
  return m;
}
const matCache = new Map();
function M(color, opts={}){
  const key = color + JSON.stringify(opts);
  if(!matCache.has(key)){
    if(opts.basic) matCache.set(key, new THREE.MeshBasicMaterial({color, transparent:!!opts.transparent, opacity:opts.opacity??1}));
    else{
      const texMap = opts.tex==='wall' ? wallTex : opts.tex==='ground' ? groundTex : opts.tex==='road' ? roadTex : null;
      matCache.set(key, new THREE.MeshLambertMaterial({color, map:texMap, flatShading:true, bumpMap:texMap||bumpTex, bumpScale:opts.bump??0.35, emissive:opts.emissive||0x000000, transparent:!!opts.transparent, opacity:opts.opacity??1}));
    }
  }
  return matCache.get(key);
}
function jitterGeo(geo, amt, seed){
  const rnd = mulberry32(seed);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setXYZ(i, p.getX(i)+(rnd()-0.5)*amt, p.getY(i)+(rnd()-0.5)*amt*0.55, p.getZ(i)+(rnd()-0.5)*amt);
  }
  geo.computeVertexNormals();
  return geo;
}
let seedCtr = 1000;
function box(w, h, d, color, x, y, z, ry=0, parent=scene, jitter=0.05){
  const m = new THREE.Mesh(jitterGeo(new THREE.BoxGeometry(w, h, d), jitter, seedCtr++), M(color));
  m.position.set(x, y, z); m.rotation.y = ry;
  parent.add(m); return m;
}
function cyl(rt, rb, h, color, x, y, z, parent=scene, seg=14){
  const m = new THREE.Mesh(jitterGeo(new THREE.CylinderGeometry(rt, rb, h, seg), h*0.02, seedCtr++), M(color));
  m.position.set(x, y, z);
  parent.add(m); return m;
}
function cone(r, h, color, x, y, z, parent=scene, seg=12){
  const m = new THREE.Mesh(jitterGeo(new THREE.ConeGeometry(r, h, seg), r*0.04, seedCtr++), M(color));
  m.position.set(x, y, z);
  parent.add(m); return m;
}
function ball(r, color, x, y, z, parent=scene){
  const m = new THREE.Mesh(jitterGeo(new THREE.SphereGeometry(r, 14, 11), r*0.05, seedCtr++), M(color));
  m.position.set(x, y, z);
  parent.add(m); return m;
}
function textSprite(text, sub, scale=1, fg='#fdf6e3'){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 160;
  const g = cv.getContext('2d');
  g.textAlign = 'center';
  g.font = '900 62px "Hiragino Maru Gothic ProN","Noto Sans SC",sans-serif';
  g.lineWidth = 10; g.strokeStyle = 'rgba(10,8,4,0.9)';

  if(sub){
    g.font = '700 40px "Hiragino Maru Gothic ProN","Noto Sans SC",sans-serif';
    g.lineWidth = 8; g.strokeText(sub, 256, 128); g.fillStyle = '#e9b44c'; g.fillText(sub, 256, 128);
  }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  sp.scale.set(11*scale, 3.44*scale, 1);
  return sp;
}
const polar = (a, r)=>[Math.cos(a)*r, Math.sin(a)*r];

/* ---------- 地面：不规则大陆 + 分层街区 + 环路大道 ---------- */
function radiusAt(a){
  return 62 + 4*Math.sin(3*a+1.3) + 3*Math.sin(5*a+0.7) + 2*Math.sin(8*a+2.1);
}
{
  // 不规则多边形大陆（星凸轮廓挤压成型，顶面为城镇地面）
  const shape = new THREE.Shape();
  const SEG = 72;
  for(let i=0;i<=SEG;i++){
    const a = (i/SEG)*Math.PI*2, r = radiusAt(a);
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    if(i===0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  const contGeo = new THREE.ExtrudeGeometry(shape, {depth:3.4, bevelEnabled:true, bevelThickness:1.1, bevelSize:1.8, bevelSegments:2, steps:1});
  contGeo.rotateX(Math.PI/2);
  const continent = new THREE.Mesh(contGeo, [M('#a08059', {tex:'ground', bump:0.5}), M('#7a5f42', {bump:0.6})]);
  continent.position.y = -1.10;
  continent.userData.noMerge = true;
  scene.add(continent);
  const rootTip = cone(34, 20, '#6f5b74', 0, -13.5, 0, scene, 9);
  rootTip.rotation.x = Math.PI;
  // 卫星小岛（3 座：灯塔礁 / 独树礁 / 碎石礁）
  const islets = [[1.15, 84, 'lamp'], [3.6, 92, 'tree'], [5.5, 80, 'rock']];
  for(const [ia, ir, kind] of islets){
    const [ix, iz] = polar(ia, ir);
    const ig = new THREE.Group();
    ig.position.set(ix, 2.5, iz);
    scene.add(ig);
    cyl(4.6, 2.0, 2.0, '#8a6d4f', 0, 0, 0, ig, 16);
    const itp = cone(2.0, 3.6, '#6f5b74', 0, -2.7, 0, ig, 8); itp.rotation.x = Math.PI;
    if(kind==='lamp'){ cyl(0.16, 0.24, 3.4, '#4a3a28', 0, 2.7, 0, ig, 7); const b = ball(0.5, '#ffd98a', 0, 4.6, 0, ig); b.material = M('#ffd98a', {emissive:0x8a6420}); }
    if(kind==='tree'){ cyl(0.24, 0.4, 1.8, '#6e5138', 0, 1.9, 0, ig, 7); ball(1.5, '#7a8450', 0, 3.6, 0, ig); ball(1.0, '#5e7153', 1.0, 2.9, 0.4, ig); }
    if(kind==='rock'){ ball(1.1, '#77648a', 0.6, 1.4, 0.3, ig); ball(0.7, '#6b5a73', -0.9, 1.2, -0.5, ig); }
  }
  // 环路 + 大道（石板贴图）

  ring.rotation.x = -Math.PI/2; ring.position.y = 0.045;
  scene.add(ring);
  for(let i=0;i<6;i++){
    const a = i*Math.PI/3 + Math.PI/12;
    const ave = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 34), M('#ffffff', {tex:'road', bump:0.25}));
    ave.rotation.x = -Math.PI/2; ave.rotation.z = -a + Math.PI/2;
    const [ax, az] = polar(a, 30.5);
    ave.position.set(ax, 0.04, az);
    scene.add(ave);
  }
  const castleAve = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 27), M('#ffffff', {tex:'road', bump:0.25}));
  castleAve.rotation.x = -Math.PI/2;
  castleAve.position.set(0, 0.04, -23.5);
  scene.add(castleAve);
  const plaza = new THREE.Mesh(jitterGeo(new THREE.CircleGeometry(11.5, 36), 0.2, 55), M('#b08a5e', {tex:'wall', bump:0.4}));
  plaza.rotation.x = -Math.PI/2; plaza.position.y = 0.05;
  scene.add(plaza);
  //  patchwork 田块（不规则色块地毯，分块感）
  const fieldCols = ['#8f7346','#977c4e','#86703f','#9c8256','#7d683c'];
  const frnd = mulberry32(2024);
  for(let i=0;i<9;i++){
    const fa = frnd()*Math.PI*2, fr = 50 + frnd()*6;
    if(Math.abs(fr*Math.sin(fa) + 36) < 15 && Math.abs(fr*Math.cos(fa)) < 18) continue; // 避开城堡
    const [fx, fz] = polar(fa, Math.min(fr, radiusAt(fa)-9));
    const f = new THREE.Mesh(jitterGeo(new THREE.CircleGeometry(4.5+frnd()*3.5, 9), 0.9, 300+i), M(fieldCols[i%5], {bump:0.3}));
    f.rotation.x = -Math.PI/2; f.rotation.z = frnd()*3;
    f.scale.set(1, 0.65+frnd()*0.4, 1);
    f.position.set(fx, 0.03, fz);
    scene.add(f);
  }
}

/* ---------- 星空与漂浮石 ---------- */
{

const CASTLE = {x:0, z:-36, hillY:5};
{

      const st = box(3.4, topY, 1.15, '#96795a', sx2, topY/2, sz2, -angle+Math.PI/2);
      st.rotation.y = -angle + Math.PI/2;
    }
  }
  const wg = new THREE.Group();
  wg.position.set(cx, baseY, cz);
  wg.rotation.y = Math.atan2(-cx, -cz);
  g.add(wg);
  if(baseY === 0){
    const tint = new THREE.Mesh(new THREE.CircleGeometry(14.5, 30), M(colorHex, {bump:0.2, transparent:true, opacity:0.20}));
    tint.rotation.x = -Math.PI/2; tint.position.set(cx, 0.055, cz);
    scene.add(tint);
  }
  (WONDERS[faction] || WONDERS['真爱粉丝'])(wg);
  const lb = textSprite(faction, membersCount + ' 人', 0.95);
  lb.position.set(cx, 11.5 + baseY, cz);
  scene.add(lb);
  shadowDisc(cx, baseY + 0.05, cz, 6.4, scene, 0.5);
  // 民居 5 栋（弧形排布）
  const houses = [];
  const rnd = mulberry32(Math.floor(angle*1000)+7);
  for(let i=0;i<5;i++){
    const ha = angle + (i-2)*0.13;
    const hr = 45.5 + (i%2)*2;
    const [hx, hz] = polar(ha, hr);
    const hg = new THREE.Group();
    hg.position.set(hx, baseY, hz);
    hg.rotation.y = Math.atan2(-hx, -hz);
    scene.add(hg);
    const bodyC = new THREE.Color(colorHex).lerp(new THREE.Color(0xf3e2c2), 0.35 + rnd()*0.3).getHex();
    const roofC = ['#a44a3f','#71563f','#5e7153','#845ec2','#c96f4a'][Math.floor(rnd()*5)];
    box(3.4, 2.5+rnd()*0.7, 3.1, bodyC, 0, 1.45, 0, 0, hg);
    const roof = cone(3.1, 1.7, roofC, 0, 3.6+rnd()*0.35, 0, hg, 4); roof.rotation.y = Math.PI/4;
    box(0.95, 1.7, 0.14, '#4a3826', 0, 0.95, 1.6, 0, hg);
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({color:0xffca7a}));
    win.position.set(1.05, 1.8, 1.58); hg.add(win);
    box(1.0, 0.1, 0.1, '#5d4a33', 1.05, 1.8, 1.62, 0, hg);
    box(0.1, 1.0, 0.1, '#5d4a33', 1.05, 1.8, 1.62, 0, hg);
    box(0.55, 0.8, 0.55, '#8d6d4e', -1.0, 3.6+rnd()*0.3, -0.7, 0, hg);            // 烟囱
    const awn = box(1.5, 0.1, 0.8, roofC, 0, 2.05, 1.85, 0, hg); awn.rotation.x = 0.35;  // 门廊
    box(1.3, 0.18, 0.7, '#96795a', 0, 0.09, 1.95, 0, hg);                            // 门阶
    if(i % 2 === 0){                                                                // 栅栏（隔栋）
      for(let fp=0; fp<3; fp++) box(0.14, 0.85, 0.14, '#a08059', -2.3+fp*0.75, 0.42, 2.3, 0, hg);
      box(2.2, 0.12, 0.1, '#a08059', -1.55, 0.68, 2.3, 0, hg);
    }
    shadowDisc(0, 0.04, 0, 3.1, hg, 0.5);
    houses.push({x:hx, z:hz, a:ha});
  }
  districtInfo.push({faction, angle, cx, cz, houses, y: baseY});
  return g;
}

/* ---------- 角色入驻 ---------- */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
let loadedCount = 0, totalCount = 69;
function finishLoad(){
  if(++loadedCount >= totalCount){
    loadingEl.style.opacity = '0';
    setTimeout(()=>loadingEl.remove(), 550);
  }
}
function placeChar(c, view, x, y, z, h=2.3, parent=scene){
  shadowDisc(x, y + 0.03, z, 0.95*(h/2.3), parent, 0.42);
  texLoader.load(`/img/view-${view}-${String(c.id).padStart(2,'0')}.webp`, tx=>{
    tx.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tx, transparent:true}));
    const w = h*(tx.image.width/tx.image.height);
    sp.scale.set(w, h, 1);
    sp.position.set(x, y + h/2, z);
    sp.userData = {id:c.id, name:c.name, title:c.title, baseScale:new THREE.Vector3(w, h, 1)};
    parent.add(sp);
    pickables.push(sp);
    finishLoad();
    render();
  }, undefined, ()=>{ finishLoad(); });
}

fetch('/characters.json').then(r=>r.json()).then(chars=>{
  totalCount = chars.length;
  const factions = [];
  for(const c of chars) if(!factions.includes(c.faction)) factions.push(c.faction);
  const byFaction = factions.map(f=>chars.filter(c=>c.faction===f));

  // 街区先建（需要 houses 坐标给居民定位）
  byFaction.forEach((members, i)=>{
    const angle = i*Math.PI/3 + Math.PI/12;
    buildDistrict(members[0].faction, members[0].color, angle, members.length, i);
  });

  /* 分配：公共建筑优先，每阵营至少留 2 人回本区 */
  const assigned = new Set();
  const remaining = ()=>chars.filter(c=>!assigned.has(c.id));
  const homeCount = f=>remaining().filter(c=>c.faction===f).length;
  function take(filterFn){
    const pool = remaining();
    const c = pool.find(x=>(!filterFn || filterFn(x)) && homeCount(x.faction) > 2) || pool.find(x=>!filterFn || filterFn(x));
    if(c) assigned.add(c.id);
    return c;
  }
  function takeFromFaction(f, skip=0){
    const pool = remaining().filter(c=>c.faction===f);
    const c = pool[skip] || pool[0];
    if(c) assigned.add(c.id);
    return c;
  }

  // 城堡班底：每阵营第一人
  const crew = byFaction.map(m=>takeFromFaction(m[0].faction));
  const [g1, g2, b1, b2, w1, w2] = crew;
  if(g1) placeChar(g1, 'front', CASTLE.x-2.4, CASTLE.hillY, CASTLE.z+7.2, 2.3);
  if(g2) placeChar(g2, 'front', CASTLE.x+2.4, CASTLE.hillY, CASTLE.z+7.2, 2.3);
  if(b1) placeChar(b1, 'front', CASTLE.x+1.9, CASTLE.hillY+4.35, CASTLE.z+7.3, 2.2);
  if(b2) placeChar(b2, 'back',  CASTLE.x-1.9, CASTLE.hillY+4.35, CASTLE.z+7.3, 2.2);
  if(w1) placeChar(w1, 'back',  CASTLE.x-5.2, CASTLE.hillY+7.6, CASTLE.z+5.4, 2.2);
  if(w2) placeChar(w2, 'back',  CASTLE.x+5.2, CASTLE.hillY+7.6, CASTLE.z+5.4, 2.2);

  // 评论公寓：9 间房
  const apartChars = [];
  for(let i=0;i<9;i++) apartChars.push(take());
  apartChars.forEach((c, i)=>{
    if(!c) return;
    const f = Math.floor(i/3), rIdx = i%3;
    const cx = -APART.W/3 + rIdx*(APART.W/3) + 0.1;
    placeChar(c, 'front', cx+0.55, f*APART.FH+0.28, 0.75, 2.0, APART.group);
  });

  // 长廊散步：4 人侧面
  for(let i=0;i<4;i++){
    const c = take(); if(!c) break;
    placeChar(c, 'side', (i%2? -1.7: 1.7), 0, -14.5 - i*2.8, 2.25);
  }
  // 广场围观喷泉：6 人
  for(let i=0;i<6;i++){
    const c = take(); if(!c) break;
    const a = i*(Math.PI*2/6) + 0.4;
    const [px, pz] = polar(a, 6.4);
    placeChar(c, i%2? 'back':'front', px, 0, pz, 2.5);
  }
  // 市集摊主：3 人
  (window.__stalls||[]).forEach((sg, i)=>{
    const c = take(); if(!c) return;
    const wp = new THREE.Vector3();
    sg.getWorldPosition(wp);
    const inward = wp.clone().normalize().multiplyScalar(-1.15);
    placeChar(c, 'front', wp.x + inward.x, 0, wp.z + inward.z, 2.2);
  });

  // 其余回各街区：门口 / 街道 / 奇观前 / 院子 轮换
  const slotCycle = ['door', 'street', 'wonder', 'yard', 'street', 'door'];
  byFaction.forEach((members, fi)=>{
    const info = districtInfo[fi];
    const rest = members.filter(c=>!assigned.has(c.id));
    rest.forEach((c, k)=>{
      const slot = slotCycle[k % slotCycle.length];
      const rnd = mulberry32(c.id*97+13);
      if(slot==='door'){
        const h = info.houses[k % info.houses.length];
        const inw = polar(Math.atan2(h.z, h.x)+Math.PI, 0); // 朝中心方向
        const dirx = -h.x/Math.hypot(h.x, h.z), dirz = -h.z/Math.hypot(h.x, h.z);
        placeChar(c, 'front', h.x + dirx*2.6 + (rnd()-0.5), info.y, h.z + dirz*2.6 + (rnd()-0.5), 2.5);
      }else if(slot==='street'){
        const a = info.angle + (k%2? 0.16 : -0.14) + (rnd()-0.5)*0.05;
        const [sx, sz] = polar(a, info.y > 0 ? 21.8 : 24.2);
        placeChar(c, 'side', sx, 0, sz, 2.5);
      }else if(slot==='wonder'){
        const a = info.angle + (rnd()-0.5)*0.3;
        const [wx, wz] = polar(a, 31.5);
        placeChar(c, 'back', wx, info.y, wz, 2.5);
      }else{
        const a = info.angle + (rnd()-0.5)*0.4;
        const [yx, yz] = polar(a, 46.5 + rnd()*2);
        placeChar(c, 'front', yx, info.y, yz, 2.5);
      }
    });
  });
  if(!new URLSearchParams(location.search).has('nomerge')) mergeStatic();
  render();
}).catch(()=>{
  document.getElementById('fallback').style.display='flex';
  loadingEl.style.display='none';
});

/* ---------- 阶段五：静态网格按材质合并（draw call 大幅下降） ---------- */
function mergeStatic(){
  try{
    scene.updateMatrixWorld(true);
    const groups = new Map();
    scene.traverse(o=>{
      if(!o.isMesh || o.userData.noMerge || o.userData.hidden) return;
      const mat = o.material;
      if(!mat || Array.isArray(mat) || (mat.transparent && !mat.userData.mergeable)) return;
      if(!o.geometry || !o.geometry.attributes.position || !o.geometry.index) return;
      if(!groups.has(mat.uuid)) groups.set(mat.uuid, {mat, items: []});
      groups.get(mat.uuid).items.push(o);
    });
    let removed = 0, added = 0;
    for(const {mat, items} of groups.values()){
      if(items.length < 2) continue;
      const geos = items.map(o=>o.geometry.clone().applyMatrix4(o.matrixWorld));
      const mg = mergeGeometries(geos, false);
      if(!mg) continue;
      const mesh = new THREE.Mesh(mg, mat);
      mesh.userData.noMerge = true;
      if(mat.userData.mergeable) mesh.renderOrder = 1;
      scene.add(mesh);
      items.forEach(o=>{ o.parent && o.parent.remove(o); removed++; });
      added++;
    }
    window.__mergeInfo = {removed, added};
  }catch(e){ window.__mergeInfo = {error: String(e)}; }
}

/* ---------- 点选与悬停 ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hovered = null;
function castAt(cx, cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}
function showTip(obj, cx, cy){
  if(obj.userData.hidden){
    tip.innerHTML = '🔒 隐藏角色<small>本人还没被想出来 · No.70–72</small>';
  }else{
    tip.innerHTML = `No.${obj.userData.id} ${obj.userData.name}<small>${obj.userData.title} · 点击查看资产卡</small>`;
  }
  tip.style.left = Math.min(cx+16, innerWidth-190)+'px';
  tip.style.top = Math.max(cy-14, 8)+'px';
  tip.style.opacity = '1';
}
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; cancelIntro(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 7) return;
  const obj = castAt(e.clientX, e.clientY);
  if(!obj) return;
  if(obj.userData.hidden){ showTip(obj, e.clientX, e.clientY); return; }
  location.href = '/#c' + obj.userData.id;
});
let moveQueued = false;
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerType !== 'mouse' || moveQueued) return;
  moveQueued = true;
  requestAnimationFrame(()=>{
    moveQueued = false;
    const obj = castAt(e.clientX, e.clientY);
    if(hovered && hovered !== obj && hovered.userData.baseScale){
      hovered.scale.copy(hovered.userData.baseScale); render();
    }
    hovered = obj;
    if(obj){
      renderer.domElement.style.cursor = 'pointer';
      if(obj.userData.baseScale){ obj.scale.copy(obj.userData.baseScale).multiplyScalar(1.13); render(); }
      showTip(obj, e.clientX, e.clientY);
    }else{
      renderer.domElement.style.cursor = '';
      tip.style.opacity = '0';
    }
  });
});

/* ---------- 开场巡航（可打断） ---------- */
let intro = null;
function cancelIntro(){ if(intro){ intro.done = true; controls.enabled = true; } }
if(!STILL && !QS.has('cam')){
  intro = {t0: performance.now(), dur: 2400, done:false};
  (function step(){
    if(intro.done) { render(); return; }
    const t = Math.min((performance.now()-intro.t0)/intro.dur, 1);
    const e = 1 - Math.pow(1-t, 3);
    camera.position.lerpVectors(CAM_START, CAM_END, e);
    camera.lookAt(LOOK[0], LOOK[1], LOOK[2]);
    renderer.render(scene, camera);
    if(t < 1) requestAnimationFrame(step);
    else { intro.done = true; controls.enabled = true; render(); }
  })();
}else{
  render();
}
