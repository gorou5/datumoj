<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评论区粘土世界 · 地图 — 72 号人物资产库</title>
<meta name="description" content="72 号评论区人物资产库的粘土世界地图：一块捏出来的大陆、一条带刺长桥与桥尽头的城堡岛，整张图按黏土材质生成，指纹、按压痕与泥块接缝都在。">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#060607}
  body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans SC",system-ui,sans-serif;color:#f3ead8}
  #backBtn{position:fixed;top:14px;left:14px;z-index:20;background:#fdf6e3;color:#26221c;border:3px solid #26221c;border-radius:99px;
    padding:8px 16px;font-weight:800;font-size:14px;text-decoration:none;box-shadow:4px 4px 0 #26221c}
  #backBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #26221c}
  #titleBox{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;width:max-content;max-width:92vw}
  #titleBox h1{font-size:clamp(19px,3.4vw,30px);letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 22px rgba(0,0,0,.9)}
  #titleBox p{font-size:12.5px;opacity:.9;margin-top:3px;text-shadow:0 1px 0 #000}
  .mapScroll{overflow-x:hidden;padding:64px 0 40px}
  .mapWrap{position:relative;width:min(1500px,100%);margin:0 auto;line-height:0}
  .mapWrap>img.base{width:100%;height:auto;display:block}
  .footNote{max-width:900px;margin:10px auto 0;padding:0 18px;text-align:center;font-size:12.5px;line-height:1.8;opacity:.65}
  @media(max-width:640px){
    #titleBox{top:60px}
    .mapScroll{overflow-x:auto;padding-top:104px}
    .mapWrap{width:235%}
  }
</style>
</head>
<body>
<a id="backBtn" href="/">← 回到选人画面</a>
<div id="titleBox">
  <h1>🌍 评论区粘土世界 · 地图</h1>
  <p>大陆 · 带刺长桥 · 城堡岛</p>
</div>

<div class="mapScroll">
  <div class="mapWrap">
    <img class="base" src="/img/world-map.webp" alt="黏土世界地图：有机大陆、带刺长桥与城堡岛" width="2048" height="1152">
  </div>
  <p class="footNote">这张世界图是按黏土世界的材质整张「捏」出来的（指纹、按压痕、泥块接缝都在），建筑造型为原创。角色们都在选人画面里，这张图就只看世界本身。</p>
</div>

</body>
</html>
