function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clayBumpTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0,0,256,256);
  const rnd = mulberry32(72);
  for(let i=0;i<340;i++){
    g.beginPath();
    const x = rnd()*256, y = rnd()*256, r = 4+rnd()*16;
    g.arc(x, y, r, rnd()*6.28, rnd()*3+1.2);
    const v = rnd()>0.5?255:0;
    g.strokeStyle = `rgba(${v},${v},${v},0.10)`;
    g.lineWidth = 1+rnd()*2.2; g.stroke();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3,2);
  return tx;
}
const bumpTex = clayBumpTexture();
function blotchTex(base, blotch, n, rMin, rMax, seed, extra){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,256,256);
  const rnd = mulberry32(seed);
  for(let i=0;i<n;i++){
    const x = rnd()*256, y = rnd()*256, r = rMin + rnd()*(rMax-rMin);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, blotch); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 6.29); g.fill();
  }
  if(extra) extra(g, rnd);
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}
const groundTex = blotchTex('#cbb28a', 'rgba(120,90,50,0.20)', 60, 18, 60, 501, (g, rnd)=>{

    const x = rx*64+32+(rnd()-0.5)*7, y = ry*64+32+(rnd()-0.5)*7, r = 24+rnd()*5;

})();
roadTex.repeat.set(9,9);

const SHADOW_MAT = new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false});

const matCache = new Map();
function M(color, opts={}){
  const key = color + JSON.stringify(opts);
  if(!matCache.has(key)){
    if(opts.basic) matCache.set(key, new THREE.MeshBasicMaterial({color, transparent:!!opts.transparent, opacity:opts.opacity??1}));
    else{
      const texMap = opts.tex==='wall' ? wallTex : opts.tex==='ground' ? groundTex : opts.tex==='road' ? roadTex : null;
      matCache.set(key, new THREE.MeshLambertMaterial({color, map:texMap, flatShading:true, bumpMap:texMap||bumpTex, bumpScale:opts.bump??0.35, emissive:opts.emissive||0x000000, transparent:!!opts.transparent, opacity:opts.opacity??1}));
    }
  }
  return matCache.get(key);
}
function jitterGeo(geo, amt, seed){
  const rnd = mulberry32(seed);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setXYZ(i, p.getX(i)+(rnd()-0.5)*amt, p.getY(i)+(rnd()-0.5)*amt*0.55, p.getZ(i)+(rnd()-0.5)*amt);
  }
  geo.computeVertexNormals();
  return geo;
}
let seedCtr = 1000;

  parent.add(m); return m;
}

}

const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
let loadedCount = 0, totalCount = 0, loadFinished = false;
window.__placed = {calls:0, ok:0, err:0, urls:[]};
function finishLoad(){
  if(loadFinished) return;
  loadFinished = true;
  mergeStatic();
  loadingEl.style.opacity = '0';
  setTimeout(()=>{ loadingEl.style.display = 'none'; }, 550);
  window.__ready = true;
  render();
}
function placeChar(c, x, y, z, kind='front', h=2.9){
  window.__placed.calls++;
  shadowDisc(x, y + 0.03, z, 0.95);
  const url = `/img/view-${kind}-${String(c.id).padStart(2,'0')}.webp`;
  texLoader.load(url, tx=>{
    window.__placed.ok++;
    tx.colorSpace = THREE.SRGBColorSpace;
    const aspect = (tx.image && tx.image.width) ? tx.image.width/tx.image.height : 0.42;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tx, transparent:true}));
    sp.center.set(0.5, 0);
    sp.scale.set(h*aspect, h, 1);
    sp.position.set(x, y, z);
    sp.userData.id = c.id;
    sp.userData.name = c.name;
    sp.userData.title = c.title;
    sp.userData.baseScale = sp.scale.clone();
    scene.add(sp);
    pickables.push(sp);
    if(++loadedCount >= totalCount) finishLoad();
    render();
  }, undefined, ()=>{
    window.__placed.err++; window.__placed.urls.push(url);
    if(++loadedCount >= totalCount) finishLoad();
  });
}

  /* 链锁浮岩瞭望 1 */
  put('高阶抬杠', ROCK_POS.x, ROCK_POS.y, ROCK_POS.z, 'front');
  /* 评论公寓 9（挑剔2/理性2/立场2/路过2/高阶1），房间行优先 */
  const aptPlan = ['挑剔观众','理性分析','立场交锋','路过乱入','挑剔观众','理性分析','立场交锋','路过乱入','高阶抬杠'];
  aptPlan.forEach((f, i)=>{
    const fl = Math.floor(i/3), rm = i%3;
    const rx = -6.5 + (rm + 0.5)*(13/3);
    put(f, 13, fl*3.1 + 0.82, -6 + rx, 'front', 2.7);
  });
  /* 回音长廊 4（侧面像，沿廊行走） */
  const corrPlan = [['路过乱入', -1.7, -4.5], ['路过乱入', 1.7, -1.5], ['挑剔观众', -1.7, 1.5], ['理性分析', 1.7, 4.5]];
  for(const [f, lx, lz] of corrPlan){
    const wx = CORRIDOR_POS.x + lx*Math.cos(0.5) + lz*Math.sin(0.5);
    const wz = CORRIDOR_POS.z - lx*Math.sin(0.5) + lz*Math.cos(0.5);
    put(f, wx, 0, wz, 'side');
  }
  /* 回声广场 6（绕喷泉，正背交替） */
  const plazaPlan = ['真爱粉丝','挑剔观众','理性分析','立场交锋','路过乱入','高阶抬杠'];
  plazaPlan.forEach((f, i)=>{
    const a = 0.3 + i*(Math.PI*2/6);
    put(f, PLAZA.x + Math.cos(a)*6.8, 0, PLAZA.z + Math.sin(a)*6.8, i%2 ? 'back' : 'front');
  });
  /* 摊位摊主 3（站在摊子背向广场一侧） */
  const stallPlan = ['路过乱入','真爱粉丝','立场交锋'];
  STALL_POS.forEach(([sx, sz], i)=>{
    const ry = Math.atan2(PLAZA.x - sx, PLAZA.z - sz);
    put(stallPlan[i], sx - Math.sin(ry)*1.5, 0, sz - Math.cos(ry)*1.5, 'front', 2.7);
  });
  /* 长桥行人 4（路过乱入，侧面像，往城堡去） */
  [[38, 7.5], [52, 12.5], [64, 7.5], [78, 12.5]].forEach(([bx, bz])=>{
    put('路过乱入', bx, 0, bz, 'side');
  });
  /* 各区填充：门口 2 → 奇观访客（背）2 → 小径行人（侧）1 → 院落其余 */
  const yardAngles = {'真爱粉丝':[2.2], '挑剔观众':[2.6], '理性分析':[0.7], '立场交锋':[5.5], '路过乱入':[1.9], '高阶抬杠':[0.4, 1.5, 2.6, 3.7, 4.8, 5.9, 0.95]};
  for(const z of zoneInfo){
    const groundY = z.kind==='hill' ? z.y : z.kind==='cliff' ? z.moundY : z.kind==='isle' ? 5 : 0;
    // 门口
    z.houses.slice(0, z.kind==='isle' ? 3 : 2).forEach(hs=>{
      const dx = z.cx - hs.x, dz = z.cz - hs.z;
      const dl = Math.hypot(dx, dz) || 1;
      put(z.faction, hs.x + dx/dl*2.4, hs.y, hs.z + dz/dl*2.4, 'front');
    });
    if(z.kind === 'isle'){
      // 城堡即奇观：余众在山顶平台环列
      let guard = 0;
      while(pools[z.faction] && pools[z.faction].length && guard < 8){
        const a = yardAngles[z.faction][guard % yardAngles[z.faction].length] + guard*0.35;
        const r = 10.2 + (guard % 3)*0.9;
        put(z.faction, z.cx + Math.cos(a)*r, 5, z.cz + Math.sin(a)*r, 'front');
        guard++;
      }
      continue;
    }
    // 奇观访客（背对镜头看奇观）
    put(z.faction, z.wonderPos.x - 3.2, z.wonderY, z.wonderPos.z + 3.8, 'back');
    put(z.faction, z.wonderPos.x + 3.2, z.wonderY, z.wonderPos.z + 4.4, 'back');
    // 小径行人（区心与广场中点；湖区中点在陆地上）
    const mx = (z.cx + PLAZA.x)/2, mz = (z.cz + PLAZA.z)/2;
    put(z.faction, mx, 0, mz, 'side');
    // 院落其余（湖区改站湖岸定点：区心环线整圈都压着湖面）
    let yi = 0;
    const SHORE = [[-16,-20],[-17,-33],[-13,-36],[-19,-26],[-20,-19]];
    while(pools[z.faction] && pools[z.faction].length){
      if(z.kind === 'lake'){
        const [px, pz] = SHORE[yi % SHORE.length];
        put(z.faction, px, groundY, pz, 'front');
      }else{
        const a = (yardAngles[z.faction] || [0.9])[yi % (yardAngles[z.faction] || [0.9]).length] + yi*0.8;
        const px = z.cx + Math.cos(a)*6.2, pz = z.cz + Math.sin(a)*6.2;
        put(z.faction, px, groundY, pz, 'front');
      }
      yi++;
      if(yi > 8) break;
    }
  }
  // 兜底清扫：任何没分到位置的角色，一律到广场边集合（保证 69 人全员到场）
  let sweep = 0;
  for(const f of Object.keys(pools)){
    while(pools[f] && pools[f].length){
      const a = 0.8 + sweep*2.4;
      put(f, PLAZA.x + Math.cos(a)*9.6, 0, PLAZA.z + Math.sin(a)*9.6, 'front');
      sweep++;
    }
  }
  if(loadedCount >= totalCount) finishLoad();
  render();
}).catch(()=>{
  loadingEl.querySelector('p').textContent = '世界没捏成，刷新再试试';
});
/* ---------- 阶段五：静态网格按材质合并（draw call 大幅下降） ---------- */
function mergeStatic(){
  try{
    scene.updateMatrixWorld(true);
    const groups = new Map();
    scene.traverse(o=>{
      if(!o.isMesh || o.userData.noMerge || o.userData.hidden) return;
      const mat = o.material;
      if(!mat || Array.isArray(mat) || (mat.transparent && !mat.userData.mergeable)) return;
      if(!o.geometry || !o.geometry.attributes.position || !o.geometry.index) return;
      if(!groups.has(mat.uuid)) groups.set(mat.uuid, {mat, items: []});
      groups.get(mat.uuid).items.push(o);
    });
    let removed = 0, added = 0;
    for(const {mat, items} of groups.values()){
      if(items.length < 2) continue;
      const geos = items.map(o=>o.geometry.clone().applyMatrix4(o.matrixWorld));
      const mg = mergeGeometries(geos, false);
      if(!mg) continue;
      const mesh = new THREE.Mesh(mg, mat);
      mesh.userData.noMerge = true;
      if(mat.userData.mergeable) mesh.renderOrder = 1;
      scene.add(mesh);
      items.forEach(o=>{ o.parent && o.parent.remove(o); removed++; });
      added++;
    }
    window.__mergeInfo = {removed, added};
  }catch(e){ window.__mergeInfo = {error: String(e)}; }
}

/* ---------- 点选与悬停 ---------- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hovered = null;
function castAt(cx, cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}
function showTip(obj, cx, cy){
  if(obj.userData.hidden){
    tip.innerHTML = '🔒 隐藏角色<small>本人还没被想出来 · No.70–72</small>';
  }else{
    tip.innerHTML = `No.${obj.userData.id} ${obj.userData.name}<small>${obj.userData.title} · 点击查看资产卡</small>`;
  }
  tip.style.left = Math.min(cx+16, innerWidth-190)+'px';
  tip.style.top = Math.max(cy-14, 8)+'px';
  tip.style.opacity = '1';
}
let downX=0, downY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; cancelIntro(); });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 7) return;
  const obj = castAt(e.clientX, e.clientY);
  if(!obj) return;
  if(obj.userData.hidden){ showTip(obj, e.clientX, e.clientY); return; }
  location.href = '/#c' + obj.userData.id;
});
let moveQueued = false;
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerType !== 'mouse' || moveQueued) return;
  moveQueued = true;
  requestAnimationFrame(()=>{
    moveQueued = false;
    const obj = castAt(e.clientX, e.clientY);
    if(hovered && hovered !== obj && hovered.userData.baseScale){
      hovered.scale.copy(hovered.userData.baseScale); render();
    }
    hovered = obj;
    if(obj){
      renderer.domElement.style.cursor = 'pointer';
      if(obj.userData.baseScale){ obj.scale.copy(obj.userData.baseScale).multiplyScalar(1.13); render(); }
      showTip(obj, e.clientX, e.clientY);
    }else{
      renderer.domElement.style.cursor = '';
      tip.style.opacity = '0';
    }
  });
});

/* ---------- 开场巡航（可打断） ---------- */
let intro = null;
function cancelIntro(){ if(intro){ intro.done = true; controls.enabled = true; } }
if(!STILL && !QS.has('cam')){
  intro = {t0: performance.now(), dur: 2400, done:false};
  (function step(){
    if(intro.done) { render(); return; }
    const t = Math.min((performance.now()-intro.t0)/intro.dur, 1);
    const e = 1 - Math.pow(1-t, 3);
    camera.position.lerpVectors(CAM_START, CAM_END, e);
    camera.lookAt(LOOK[0], LOOK[1], LOOK[2]);
    renderer.render(scene, camera);
    if(t < 1) requestAnimationFrame(step);
    else { intro.done = true; controls.enabled = true; render(); }
  })();
}else{
  render();
}
