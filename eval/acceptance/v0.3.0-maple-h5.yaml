# 检索词按资料语言写（MCP 客户端改写后的样子，同 eval/questions/maple_multilingual.yaml）；题面保留提问语言。
questions:
- id: h5-ja-1
  lang: ja
  question: 最近、気象庁が発表した大雨や洪水に関する警報・注意報は？
  calls: [{tool: search_docs, args: {queries: 大雨 洪水 警報 注意報, sources: [jp-jma], since: "2026-11-08", k: 5}}]
- id: h5-ja-2
  lang: ja
  question: 日本の総人口の月別推計（e-Stat）で最新の値は？
  calls: [{tool: search_catalog, args: {query: 人口推計 月別 総人口, sources: [jp-estat-api], k: 5}}]
- id: h5-ja-3
  lang: ja
  question: 佐賀市の公民館の一覧は？
  calls: [{tool: search_docs, args: {queries: 佐賀市 公民館, sources: [jp-ksj], k: 5}}]
- id: h5-ja-4
  lang: ja
  question: 月面基地の建設補助金は？
  calls: [{tool: search_docs, args: {queries: 月面基地 建設 補助金, k: 5}}]
- id: h5-zh-1
  lang: zh
  question: 日本个人信息保护法里关于向第三方提供个人数据的规定是什么？
  calls: [{tool: search_docs, args: {queries: 個人情報 第三者提供 制限, sources: [jp-egov-law], k: 5}}]
