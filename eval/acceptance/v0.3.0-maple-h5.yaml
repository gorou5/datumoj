  calls: [{tool: search_docs, args: {queries: temporary safety zone, sources: [us-fedreg], k: 5}}]
- id: h5-zh-4
  lang: zh
  question: 日本各地有哪些公共设施的开放数据？
  calls: [{tool: search_catalog, args: {query: 公共施設 一覧, sources: [jp-bodik, jp-egov-data], k: 5}}]
