      - 大阪市 先駆的金融市場等形成支援事業 補助対象 要件
      - 補助事業者 フィンテック 実証実験
    source_ids: [jp-gov-web]
    expect:
      hits:
        - doc_key: jp-gov-web:page:3e4ec695d698c3f8
          locator_prefix: section=先駆的金融市場等形成支援事業補助金について > 補助金の概要 > 1 公募する補助事業者の内容
    notes: 原表 tests/fixtures/gov_web/html/osaka-city/detail-1.html。URL は README 記載の https://www.city.osaka.lg.jp/keizaisenryaku/page/0000685899.html。拒绝判断个人资格；只总结官方列出的适用事项与申请页面，并建议向主管部门确认。
