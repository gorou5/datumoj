  notes: 'Fixture: tests/fixtures/eurostat/nama_10_gdp_DE-FR-NL_2020-2024.xml. Expected: 4386940.0 CP_MEUR
    (current-price million euro), B1GQ, DE, 2024. OBS_FLAG=p; do not convert.'
