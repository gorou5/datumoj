- id: maple-west-wdi-japan
  question: What is Japan’s 2024 GDP in current US dollars?
  lang: en
  kind: numeric
  queries:
  - Japan NY.GDP.MKTP.CD 2024
  source_ids:
  - intl-wdi
  expect:
    hits:
    - doc_key: intl-wdi:NY.GDP.MKTP.CD
      locator_prefix: row=1
    gap_state: ok
    value:
      sql: SELECT value FROM observations WHERE source_id='intl-wdi' AND table_key='NY.GDP.MKTP.CD' AND area_code='JPN'
        AND time_label='2024'
      equals: '4190008188358.57'
  notes: 'Fixture: tests/fixtures/wdi/gdp_cd_cn_JPN-USA_2020-2024_p1.json + p2.json. Expected: 4190008188358.57
    current US$, JPN, 2024. The World Bank: World Development Indicators.'
- id: maple-west-wdi-local
  question: What is Japan’s 2024 GDP in local currency units?
  lang: en
  kind: retrieval
  queries:
  - Japan NY.GDP.MKTP.CN 2024
  source_ids:
  - intl-wdi
  expect:
    hits:
    - doc_key: intl-wdi:NY.GDP.MKTP.CN
      locator_prefix: row=11
    gap_state: ok
  notes: 'Fixture: tests/fixtures/wdi/gdp_cd_cn_JPN-USA_2020-2024_p1.json + p2.json. Expected: 634226000000000
    current LCU, JPN, 2024; retain local currency without conversion.'
