questions:
- id: maple-west-fed-hazards
  question: What hazards justify the St. Lawrence River safety zones?
  lang: en
  kind: retrieval
  queries:
  - overhead electrical transmission wires
  source_ids:
  - us-fedreg
  expect:
    hits:
    - doc_key: us-fedreg:2026-20122
      locator_prefix: section=SUPPLEMENTARY INFORMATION > II. Background and Authority
    gap_state: ok
  notes: 'Fixture: tests/fixtures/fedreg/full_text_2026-20122.xml. Expected: Deployment of personnel and heavy
    equipment across navigable waters during overhead wire replacement threatens workers and the public.'
