questions:
  - id: stat-dashboard-tokyo-population-2023
    question: 統計ダッシュボードの人口推計では、2023年の東京都の総人口はいくらですか？
    lang: ja
    kind: numeric
    queries:
      - 東京都 総人口 人口推計 2023年
    source_ids: [jp-stat-dashboard]
    expect:
      hits:
        - doc_key: jp-stat-dashboard:0201010000000010000
      value:
        sql: "SELECT value FROM observations WHERE source_id = 'jp-stat-dashboard' AND table_key = '0201010000000010000' AND indicator_code = '0201010000000010000' AND area_code = '13000' AND time_start = '2023-01-01'"
        equals: 14086000
        tolerance: 0
    notes: "原表：tests/fixtures/stat_dashboard/getData_b1_pop5x48_2021-2023CY.json；位置：STATISTICAL_DATA.DATA_INF.DATA_OBJ[110]，@indicator=0201010000000010000、@regionCode=13000、@time=2023CY00、@stat=20020101 的 VALUE.$。"

